[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "liveness-eval-lab"
version = "0.1.0"
description = "Compact liveness models, knowledge distillation, Caffe/NCNN export and score evaluation"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
train = ["torch>=2.1"]
export = ["torch>=2.1", "grpcio-tools>=1.60", "protobuf>=4.25"]
verify = ["numpy", "opencv-python>=4.8,<5", "ncnn"]

[project.scripts]
liveness-lab = "liveness_lab.__main__:main"

[tool.setuptools]
packages = ["liveness_lab"]
